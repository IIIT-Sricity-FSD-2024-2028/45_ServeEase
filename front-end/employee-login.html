<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ServeEase | Employee Login</title>
  <link rel="stylesheet" href="CSS/global.css" />
  <link rel="stylesheet" href="CSS/auth.css" />
  <link rel="stylesheet" href="CSS/employee-auth.css" />
</head>
<body class="employee-login-page">
  <main class="auth-page">
    <div class="auth-wrapper">
      <div class="auth-left">
        <div class="brand auth-brand">
          <div class="brand-icon">SE</div>
          <span>ServeEase</span>
        </div>

        <div class="auth-card employee-login-card">
          <h1>Employee Login</h1>
          <p class="auth-subtitle">Use your Employee ID to access permitted workspaces.</p>

          <form id="employeeLoginForm" novalidate>
            <div class="form-group">
              <label for="employeeId">Employee ID</label>
              <input type="text" id="employeeId" autocomplete="username" placeholder="Enter your employee ID" />
              <small class="error" id="employeeIdError"></small>
            </div>

            <div class="form-group">
              <label for="employeePassword">Password</label>
              <input type="password" id="employeePassword" autocomplete="current-password" placeholder="Enter your password" />
              <small class="error" id="employeePasswordError"></small>
            </div>

            <small class="error form-error" id="employeeLoginError"></small>
            <small class="success-message" id="employeeLoginSuccess"></small>

            <button class="btn btn-primary btn-full" type="submit">Authenticate</button>
          </form>

          <p class="employee-login-note">
            Customer, Provider, Support, or Superuser?
            <a href="login.html">Use standard login</a>
          </p>
        </div>
      </div>

      <div class="auth-right">
        <div class="promo-image">
          <img src="https://images.unsplash.com/photo-1581578731548-c64695cc6952?auto=format&fit=crop&w=900&q=80" alt="ServeEase service" />
        </div>
        <h2>ServeEase Employee Access</h2>
        <p>Department access is based on the authenticated employee profile.</p>
      </div>
    </div>
  </main>

  <script src="JavaScript/employee-auth.js"></script>
  <script src="JavaScript/employee-login.js"></script>
</body>
</html>
