<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ServeEase | Customer Operations</title>
  <link rel="stylesheet" href="CSS/global.css" />
  <link rel="stylesheet" href="CSS/home.css" />
  <link rel="stylesheet" href="CSS/dashboard.css" />
  <link rel="stylesheet" href="CSS/customer-operations.css" />
</head>
<body class="customer-operations-page">
  <header class="dashboard-topbar customer-operations-topbar">
    <a class="dashboard-brand portal-brand" href="index.html" aria-label="ServeEase home">
      <span class="brand-icon portal-brand-mark">SE</span>
      <span>ServeEase</span>
    </a>
    <nav class="dashboard-topbar-actions portal-nav" aria-label="Customer operations navigation">
      <button class="btn btn-outline" type="button" id="customerOperationsLogoutBtn">Logout</button>
    </nav>
  </header>

  <main class="dashboard-page superuser-page portal-shell">
    <div class="container">
      <div class="breadcrumb-row">
        <a href="index.html">Home</a><span aria-hidden="true">›</span><span>Employee</span><span aria-hidden="true">›</span><strong>Customer Operations</strong>
      </div>

      <section class="panel-card superuser-title-card left-accent-blue portal-hero" aria-labelledby="customerOperationsTitle">
        <div>
          <h1 id="customerOperationsTitle">Customer Operations</h1>
          <p class="portal-description">Internal customer management and operational visibility for ServeEase.</p>
        </div>
      </section>

      <section class="superuser-booking-stat-grid customer-stats" id="customerOperationsStatsGrid" aria-label="Customer operations summary"></section>

      <section class="panel-card superuser-table-panel" id="manage-customers">
        <div class="panel-head">
          <h2>Manage Customers (<span id="customerOperationsCustomerCount">0</span>)</h2>
          <select class="superuser-status-filter" id="customerOperationsStatusFilter" aria-label="Filter customers by status">
            <option value="all">All Status</option>
            <option value="Active">Active</option>
            <option value="Blocked">Blocked</option>
            <option value="N/A">N/A</option>
          </select>
        </div>
        <label class="customer-operations-search" for="customerOperationsSearch">Search customers<input type="search" id="customerOperationsSearch" placeholder="Name, email, phone, or status" /></label>
        <div class="superuser-table-wrap">
          <table class="superuser-table compact-table">
            <thead>
              <tr>
                <th>Customer ID</th>
                <th>Name</th>
                <th>Email</th>
                <th>Phone</th>
                <th>Location</th>
                <th>Status</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="customerOperationsRows"></tbody>
          </table>
        </div>
      </section>
    </div>
  </main>

  <script src="JavaScript/api.js"></script>
  <script src="JavaScript/employee-auth.js"></script>
  <script src="JavaScript/data-completion.js"></script>
  <script src="JavaScript/customer-operations.js"></script>
</body>
</html>
